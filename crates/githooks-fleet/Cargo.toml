[package]
name = "githooks-fleet"
version = "0.1.0"
edition = "2021"

[dependencies]
# The registry is the source of truth for what a check IS. Hand-copying the
# names here let the dashboard silently omit a check the dispatcher runs.
githooks-runtime = { path = "../githooks-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
serde_json = "1"
