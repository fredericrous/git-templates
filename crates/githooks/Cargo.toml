[package]
name = "githooks"
version = "0.1.0"
edition = "2021"
# Inherited from [workspace.package]: 1.74, verified against the toolchain
# rather than asserted. See the workspace manifest.
rust-version.workspace = true
description = "The git-templates hooks, as one dependency-free binary"
license = "MIT"

# Only the runtime, which itself has none. See crates/githooks-runtime.
[dependencies]
githooks-runtime = { path = "../githooks-runtime" }

# Test-only: asserting on parsed JSON structure rather than substrings for
# `list --json`. Does not touch the shipped binary — check-no-deps.sh's
# `--edges normal` excludes dev-dependencies, and CI verifies that directly.
#
# This does mean `cargo test` on the commit-path crates needs a registry and a
# newer cargo than 1.74; the `msrv` job runs `cargo check`, not `cargo test`,
# for exactly that reason. The floor is a claim about the SHIPPED code.
[dev-dependencies]
serde_json = "1"
