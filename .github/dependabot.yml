# Dependency updates, and the reason the file is short.
#
# `githooks` and `githooks-runtime` have no external dependencies at all —
# that is the policy scripts/check-no-deps.sh enforces and the `deps` CI job
# proves — so there is exactly one crate here with a tree to update:
# githooks-fleet (ratatui, crossterm, serde, ~57 packages resolved). This file
# and CI's `audit` job are the two halves of watching it: `audit` says "this
# tree has a known advisory", dependabot says "there is a newer version".
#
# Neither can reach the commit path. If a bump ever lands in `githooks`'
# resolved tree, `deps` fails the PR — which is the correct outcome and worth
# knowing dependabot cannot cause silently.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One PR for the routine churn. ratatui and crossterm move often and their
    # patch/minor releases are not individually interesting; five separate PRs a
    # week for them is a review tax that gets paid by not reviewing any of them.
    # MAJOR bumps are deliberately left OUT of the group so they arrive as their
    # own PR with their own changelog to read.
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # The workflow's own supply chain. `audit` exists because a dependency is code
  # running in a privileged position; a pinned action is the same thing with a
  # different package manager, and this repository's workflows use `actions/*`
  # only, on purpose (see the `audit` job's comment about not pulling a
  # marketplace action into the supply-chain job).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
