name: CI

# These hooks stand between the author and every commit/push in ~96 repos, so a
# broken one is felt immediately and everywhere. `make test` was dev-machine
# only until now; this runs it on every push and PR.
#
# Matrix on purpose: the hooks ship to a macOS workstation but also run on Linux
# CI runners, and they lean on tools whose flags differ by platform (BSD vs GNU
# realpath/grep/sed — the ban-terms hook already carries a comment about POSIX
# regex flavour varying). A single-platform run would let that class of break
# through.

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub's DEFAULT shell is `bash -e {0}` — no pipefail. Only naming bash
# explicitly gets `bash -eo pipefail {0}`. Without this, `make test | tee`
# reports the exit status of `tee` (always 0) and a failing suite goes GREEN.
# That is exactly what the first run of this workflow did: both jobs passed
# while `make` had printed "*** [test] Error 1".
defaults:
  run:
    shell: bash

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # The behavioural coverage lives in the zsh suites (they drive the binary
      # through the shims); these two just keep the source honest.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  syntax:
    name: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Cheap backstop for the hooks no test file covers (argo-lint,
      # kube-linter, kubeconform, yamllint): a syntax error in one of those
      # ships silently today. Parse-only, nothing is executed.
      - name: Parse every hook
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zsh
          # Dispatch on the SHEBANG, never the extension. The Rust migration
          # leaves shims at the original paths (docs/rust-migration.md), so
          # `pre-commit-ban-terms.js` is POSIX sh and `pre-push-pull-rebase.zsh`
          # is too — the names no longer describe their contents. Checking by
          # extension ran `node --check` over a shell script.
          rc=0
          for f in templates/hooks/*; do
            [ -f "$f" ] || continue
            case "$f" in */package.json) continue ;; esac
            case "$(head -1 "$f")" in
              *zsh)  zsh -n "$f"       || { echo "::error file=$f::zsh parse error"; rc=1; } ;;
              *node) node --check "$f" || { echo "::error file=$f::node parse error"; rc=1; } ;;
              */sh)  sh -n "$f"        || { echo "::error file=$f::sh parse error"; rc=1; } ;;
              *) echo "::error file=$f::unrecognised shebang: $(head -1 "$f")"; rc=1 ;;
            esac
          done
          exit $rc

  # Phase 2 of docs/rust-migration.md. Only meaningful now that no hook is zsh:
  # until this batch, a real commit on Windows failed the moment any applicable
  # hook was a zsh script Git for Windows cannot execute.
  #
  # The zsh SUITES cannot run here — they are zsh scripts, and porting 19 of
  # them is a separate job. So this proves the two things that actually matter
  # on Windows: the binary's own tests pass, and a real `git commit` goes
  # through the shims end to end. Git for Windows ships `sh`, which is what the
  # shims are.
  windows:
    name: windows smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo test

      - name: A real commit runs through the hooks
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          BIN="$PWD/target/release/githooks.exe"
          [ -x "$BIN" ] || BIN="$PWD/target/release/githooks"

          repo=$(mktemp -d)/r && mkdir -p "$repo" && cd "$repo"
          # --template= (empty): without it `git init` copies the MACHINE's
          # installed hooks in and the smoke would test those, not these.
          git init -q --template= .
          git config user.email ci@example.com
          git config user.name "windows ci"

          mkdir -p .git/hooks
          for h in commit-msg prepare-commit-msg pre-commit; do
            cp "$GITHUB_WORKSPACE/templates/hooks/$h" ".git/hooks/$h"
            sed -i "s|__GITHOOKS_BIN__|$BIN|g" ".git/hooks/$h"
            chmod +x ".git/hooks/$h"
          done
          # sub-hooks the dispatcher will find
          for h in pre-commit-merge-conflict.zsh pre-commit-package-lock.zsh; do
            cp "$GITHUB_WORKSPACE/templates/hooks/$h" ".git/hooks/$h"
            sed -i "s|__GITHOOKS_BIN__|$BIN|g" ".git/hooks/$h"
            chmod +x ".git/hooks/$h"
          done

          echo "hello" > a.txt && git add a.txt
          git commit -m "feat: a windows commit through the rust hooks"

          # commit-msg must have rewritten the subject with the gitmoji prefix —
          # proof the hook ran and edited the message, not merely exited 0.
          # The commit must EXIST before its subject means anything: an empty
          # subject from a failed commit would otherwise satisfy a naive
          # "differs from the plain text" check.
          git rev-parse --verify HEAD > /dev/null 2>&1 \
            || { echo "::error::commit did not happen"; exit 1; }
          subject=$(git log -1 --format=%s)
          echo "subject: $subject"
          case "$subject" in
            *"feat: a windows commit through the rust hooks") ;;
            *) echo "::error::commit-msg did not run"; exit 1 ;;
          esac
          [ "$subject" = "feat: a windows commit through the rust hooks" ] \
            && { echo "::error::gitmoji prefix missing — hook did not rewrite"; exit 1; }
          echo "windows end-to-end OK"

  test:
    name: hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # zsh: the runner and every test are zsh scripts (default shell on macOS,
      # absent on the Ubuntu image).
      # fd: NOT optional — pre-push-run-tests-js shells out to `fd package.json`
      # to find packages, so without it that hook throws and its test fails.
      # Debian ships the binary as `fdfind` (name clash with another package).
      # zsh: the runner and every TEST is a zsh script (default on macOS, absent
      # on the Ubuntu image). The hooks themselves no longer need it.
      #
      # fd and rg used to be installed here and are no longer required by any
      # hook: the Rust ports use `git ls-files` and native matching. Both were
      # undeclared hard dependencies whose absence produced silent WRONG answers
      # rather than errors — see the guard added in #13, now retired with the
      # shell it protected.
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zsh

      - name: Install ruff (macOS)
        if: runner.os == 'macOS'
        run: brew install ruff

      - name: Install ruff (Linux)
        if: runner.os == 'Linux'
        run: pipx install ruff

      # Fail here, with a name, rather than 14 suites down as an opaque
      # assertion failure — the hooks' hard dependencies are undeclared
      # anywhere else in the repo.
      - name: Hard dependencies are present
        run: |
          rc=0
          for bin in zsh git node npm cargo; do
            if command -v "$bin" > /dev/null; then
              printf '  ok   %-5s %s\n' "$bin" "$(command -v "$bin")"
            else
              printf '  MISS %-5s\n' "$bin"; rc=1
            fi
          done
          exit $rc

      # The tool-dependent tests (lint-js, prettier, ruff, pyright) skip
      # gracefully when their binary is missing — which would leave CI green
      # while silently testing far less. Install them so those suites actually
      # assert something. Resolution order in the hooks ends at PATH, so a
      # global install is enough.
      - name: Install the tools the hooks drive
        run: npm i -g eslint prettier pyright

      # Every test does real commits in a throwaway repo. Only two set a local
      # identity, so without a global one the rest fail at `git commit` with
      # "Please tell me who you are" — and the failure would look like a hook
      # bug rather than a missing CI setting.
      - name: Git identity for the throwaway test repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "git-templates ci"
          git config --global init.defaultBranch main

      # tee, not a second run: the skip check below reads this output rather
      # than paying for the whole suite twice. Depends on the workflow-level
      # `shell: bash` above for pipefail — see the comment there.
      - name: make test
        run: make test 2>&1 | tee /tmp/hooks-test.log

      # A skip is legitimate (a tool genuinely absent) but must not pass
      # unnoticed: the whole point of installing the tools above is that these
      # suites run for real. A green tick over a suite that quietly skipped is
      # the failure mode worth surfacing.
      # Match the tests' actual skip marker, not the bare word: one test is
      # NAMED "Should stop at the first failure, skipping the rest of the gate",
      # so `grep skipping` warned on a perfectly healthy run. A warning that
      # cries wolf is one people learn to scroll past.
      - name: Report skipped suites
        if: always()
        run: |
          if grep -q "unavailable — skipping" /tmp/hooks-test.log; then
            echo "::warning::suites skipped despite the tools being installed:"
            grep "unavailable — skipping" /tmp/hooks-test.log
          else
            echo "no suites skipped"
          fi
