# The toolchain this repository builds with, pinned.
#
# WHY A PIN, when "latest stable" is the usual advice: CI runs
# `cargo clippy --all-targets -- -D warnings`, and `amont`' own
# `pre-commit-clippy` runs a wider one on every Rust commit here. Under
# `-D warnings`, every clippy release is a potential breaking change — a lint
# added upstream turns an untouched, already-merged commit red on the next
# scheduled run. On a floating stable that arrives on a Thursday with no commit
# to blame it on, in the one repository that gates every commit and push across
# ~96 others. This pin is what makes a red build attributable to a change
# somebody made.
#
# BUMPING THIS IS A DELIBERATE PR, not a drive-by. Raise the version, run
# `make check`, and fix whatever new lints fire in the SAME change, so the lint
# fixes are reviewed as lint fixes rather than as noise inside an unrelated
# diff. That is the whole cost of the pin, and it is the point of it.
#
# NOT the MSRV. This is what we BUILD with; the floor the source is allowed to
# require is `rust-version` in Cargo.toml (1.74 for the commit-path crates),
# and CI's `msrv` job is what proves that floor is real. The two numbers move
# independently and mean different things.
[toolchain]
channel = "1.94.1"
# rustfmt and clippy are separately-installable components. Naming them here
# means `rustup` provisions them with the toolchain, so `make lint` works on a
# fresh checkout instead of failing with "'cargo-clippy' is not installed".
components = ["rustfmt", "clippy"]
